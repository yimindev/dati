# E2E 测试公共数据
# 用例通过自然语言引用（如 "使用 test-data.yaml 中的 datasources.postgres_local"）

users:
  qa_user:
    name: "qa-e2e-tester"
    password: "QaTest123456"
    type: "local"
  # 全局管理员（对应后端 auth.admin-users 配置，默认 admin）
  # 注意：密码与测试标准密码不同，为环境预置账户
  qa_admin:
    name: "admin"
    password: "admin123"
    type: "local"

# ---- API Key 测试（TC-AK-*）----
api_keys:
  # 固定验收 key（TC-AK-009）：永久不过期，明文保存在 /tmp/dati_apikey.txt
