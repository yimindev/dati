      修复：PermissionService 新增 onResourceDeleted(type, resourceId)，DataSourceService/SubjectService/McpServiceService 删除路径统一调用 ResourceAclDAO.deleteByResourceTypeAndResourceId 清理 ACL。验证：PermissionServiceTest + 三个 service 测试断言调用；真实后端创建 subject/MCP 服务/数据源 → 授权 → 删除后直接查 H2，resource_acl 对应 resource_id 均为 0 行。
  - id: BUG-20261019-003
    title: 游客可创建 API Key，但生成的 key 永远无法通过认证（401）
    module: 认证
    severity: low
    fixed_at: 2026-10-21
    description: |
      TC-AUTH（探索发现）：携带 guest token 调用 POST /v1/auth/api-keys 返回 201 并下发 sk_ 明文 key（expires_at=null），但用该 key 请求 GET /v1/auth/me、GET /v1/data-sources 均返回 401。根因：ApiKeyService.create 仅写入 userId，不校验该用户在 users 表中是否存在；guest 身份是纯 JWT（GuestService 不落库），ApiKeyAuthenticationProvider.authenticate 中 userRepository.findById(key.userId) 为空即认证失败。影响：①游客拿到的是永不过期的死凭证，前端若引导游客创建 key 会出现“创建成功但不可用”；②未登录者可无限创建 key 行，造成脏数据。建议：创建 API Key 时对游客身份直接拒绝（403，错误码 AUTH/GUEST 前缀）或校验 userId 存在。
      修复：ApiKeyService.create 在生成 key 前校验 userId 在 users 表存在（UserRepository.existsById），游客/未知用户返回 403 AUTH008「API keys can only be created for registered user accounts」，不再产生死凭证。验证：ApiKeyServiceTest 覆盖游客拒绝且不落库；真实后端 curl 验证 guest token 创建 key → 403 AUTH008，列表仍为空。
