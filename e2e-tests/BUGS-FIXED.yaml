  - id: BUG-20260809-002
    title: PUT /prompts/{id} 部分更新仅传 content 时报 MS007（parameters 缺失被当作空列表校验）
    module: MCP 服务管理
    severity: high
    fixed_at: 2026-08-09
    description: |
      McpPromptService.updatePrompt 对部分请求体直接调用 validateContentParams：请求只传 content 时 parameters=null，extractDefinedParams(null) 返回空集，content 中所有 {{var}} 均判为未定义 → MS007 'Unknown parameter(s) in content'。TC-MCP-003 step5（仅改 content 的部分更新）复现。另：po.setEnabled(prompt.isEnabled()) 无条件覆盖，请求缺 enabled 时（boolean 默认 false）会静默禁用 prompt —— 部分更新数据丢失隐患。修复方向：参数未传时从 DB 合并已持久化参数再校验，enabled 改为仅当请求显式携带时更新。
