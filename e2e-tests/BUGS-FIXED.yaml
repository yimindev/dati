bugs:
  - id: BUG-20261022-001
    title: 注册接口无密码强度校验，1 字符密码即可注册成功
    module: 认证
    severity: medium
    found_at: 2026-10-22
    fixed_at: 2026-10-22
    description: |
      RegisterRequest.password 改为 @Size(min = 8, max = 72)（上限对应 BCrypt 只取前 72 字节），
      超界返回 400 CM001「password: must be between 8 and 72 characters」；前端注册页同步校验并提示
      「密码长度至少 8 位」。同时为 name/display_name 增加 @Size 约束，超长由 500 改为 400。
      覆盖测试：RegisterControllerTest（1 位/7 位/8 位边界）、app AuthenticationErrorResponseTest。

  - id: BUG-20261022-002
    title: 用户名唯一性区分大小写，可注册视觉上无法区分的重复账户
    module: 认证
    severity: low
    found_at: 2026-10-22
    fixed_at: 2026-10-22
    description: |
      登录名统一规范化（trim + toLowerCase(Locale.ROOT)，见 core LoginName）：注册落库、existsByName 查重、
      login 的 findByName 全部使用规范化值，display_name 承担展示大小写。因此 QA 与 qa 是同一账号：
      重复注册返回 409 AUTH003，登录可用任意大小写并忽略前后空格，/v1/auth/me 返回规范化后的 name。
      并发注册的 DataIntegrityViolationException 同样映射为 AUTH003 而非 500。
      说明：这是显式规范化，不再依赖数据库 collation（H2 区分大小写、MySQL 默认 utf8mb4_0900_ai_ci 不区分）。

