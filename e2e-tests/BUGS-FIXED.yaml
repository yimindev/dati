    description: |
      TC-MCP-001 步骤 6 / TC-MCP-010 步骤 2 探索：PUT /v1/mcp-services/{id} 仅传 {"description":"..."}（意图为部分更新）→ 400 CM001 "Request parameter error: name: 不得为空白"，description 未更新；2026-10-19 报告该步骤为 200，本次失败，属回归。同源问题：PUT /v1/terms/{id} 仅传 description → 同样 400 CM001（name 不得为空白）；PUT /v1/subjects/{id} 因使用独立 UpdateSubjectRequest 未受影响。
      根因：cc3594c（修复 BUG-20261022-008 的 name 长度校验）给 BaseResource.name 加了 @NotBlank + @Size(max=64)。McpService 与 Term 的更新接口直接 @RequestBody 绑定领域模型（继承 BaseResource），@Valid 校验因此把「未传 name」当作非法；工具（McpTool）此前已通过 UpdateToolRequest 支持真正部分更新（BUG-20261022-014），服务/术语没有对应改造。
      影响：①前端/API 客户端无法只改描述，必须回传完整 name，容易误覆盖；②TC-MCP-001/010 的 MVP 主链路（更新描述 → 发布/回滚）需传 name 才能通过，用例与实现契约不一致。
      建议：为 MCP 服务与术语引入 UpdateMcpServiceRequest / UpdateTermRequest（name 可选，仅当出现时做 @Size/@NotBlank 校验），Service 层只合并请求中出现的字段；或在 Controller 绑定前把 name 从校验中排除（分组校验）。修复后需回归 TC-MCP-001、TC-MCP-010、TC-MCP-011，并补单测覆盖「仅传 description」「仅传 enabled 类字段」两类部分更新。
  - id: BUG-20261023-009
    title: 调用日志的工具名筛选被静默忽略：后端只认 toolName，前端与用例传 tool_name
    module: MCP 服务管理
    severity: medium
    fixed_at: 2026-10-24
    description: |
      TC-MCP-025 步骤 4 探索：GET /v1/mcp-services/{id}/invocation-logs?tool_name=execute_sql 返回全部日志（total=2，含 list_tables_and_terms），筛选完全未生效；改用 ?toolName=execute_sql 才正确返回 1 条。success=true/false 筛选正常。
      根因：McpServiceController.listInvocationLogs 使用 @RequestParam(required=false) String toolName 未显式指定 name，Spring 按 Java 参数名绑定 camelCase 的 toolName；而前端 frontend/src/api/mcp-usage.ts 的 listMcpInvocationLogs 发送的是 tool_name（snake_case），openapi.json 亦记录为 toolName。契约与调用方不一致，且未知查询参数被静默忽略（不会 400），所以 UI 的「工具名」筛选看起来能点但永远返回全量。
      影响：前端用量统计页的工具名筛选失效（静默返回全量），排查慢查询/单工具失败率时结论错误；同时违反项目 body/query 统一 snake_case 的约定。
      建议：改 Controller 为 @RequestParam(name="tool_name", required=false) String toolName（或全局开启 snake_case 查询参数解析），同步 openapi 与前端；对未知查询参数可考虑记录 WARN 日志便于排查。补 Controller 测试覆盖 tool_name 筛选。
  - id: BUG-20261023-003
    title: 主题/术语创建与更新缺少长度校验，超长 name(>64)/description(>1024) 返回 500 CM003
    module: 语义层
    severity: medium
    fixed_at: 2026-10-24
    description: |
      TC-SEM-001/003/006/007 探索（站在调用方角度验证输入边界，用例未覆盖）：POST /v1/subjects、POST /v1/subjects/{id}/terms、PUT /v1/subjects/{id}、PUT /v1/terms/{id} 对 name/description 缺少长度校验，超长输入直接落库触发 DataIntegrityViolationException → GlobalExceptionHandler 兜底返回 HTTP 500 {code:CM003,message:'Internal server error'}，而非 400 CM001。复现（qa-e2e-tester）：①POST /v1/subjects name=65 字符 → 500 CM003（name=64 字符 → 200，边界正确）；②POST /v1/subjects description=1025 字符 → 500 CM003；③POST /v1/subjects/{id}/terms name=65 字符 → 500 CM003；④POST /v1/subjects/{id}/terms description=1025 字符 → 500 CM003；⑤PUT /v1/subjects/{id} description=1025 字符 → 500 CM003。根因：CreateSubjectRequest/CreateTermRequest/UpdateTermRequest/UpdateSubjectRequest 只有 @NotBlank/@Pattern，未加 @Size(max=64)/@Size(max=1024)，而 BaseResource.name/description 上的 @Size 只作用于实体、未在请求 DTO 上校验，故服务层校验通过后由 DB 列宽抛错。对比：数据源模块已在 BUG-20260805-002 修复中为 Create/UpdateDataSourceRequest 补 @Size 并验证 400 CM001；前端虽把 name 上限统一到 64，但直接调用 API 或未来 UI 放宽时会稳定 500，且错误信息不可自诊断。建议：为四个语义层请求 DTO 补 @Size(max=64)（name，含 TABLE 语义的空白 Pattern 保留）与 @Size(max=1024)（description），并补 SubjectControllerTest/TermControllerTest 边界单测（64/65、1024/1025）。
  - id: BUG-20261023-001
    title: 模板提取接口 variables 丢失模板书写顺序（Collectors.toSet 退化为哈希序）
    module: 模板预览
    severity: low
    fixed_at: 2026-10-24
    description: |
      复现：POST /v1/template/extract {"template":"{{zeta}} {{alpha}} {{mike}} {{bravo}}"} → {"variables":["zeta","bravo","mike","alpha"]}，多次调用稳定但非模板顺序。
      期望：按模板中变量出现顺序返回 ["zeta","alpha","mike","bravo"]。
      根因：ParsedTemplate.getVariables() 已返回保序 LinkedHashSet，TemplatePreviewController.extract 用 Collectors.toSet() 重新收集为 HashSet，顺序退化为哈希序。
      影响：前端 PromptDialog / CustomToolDialog「扫描参数」按返回顺序生成参数表单，用户看到的参数顺序与模板书写顺序不一致，模板复杂时易错配。
      建议：改为 Collectors.toCollection(LinkedHashSet::new)，并补顺序断言单测。
  - id: BUG-20261023-002
    title: 请求体反序列化失败统一返回 CM001「Failed to read request」，不含字段名/非法值，客户端无法定位问题
    module: 通用-错误处理
    severity: low
    fixed_at: 2026-10-24
    description: |
      TC-SYS-001 延伸探索（站在客户端角度验证 /v1/system/config 返回的 supported_database_types 取值空间）发现：任何请求体反序列化失败都只返回 400 {code:CM001, message:'Request parameter error: Failed to read request'}，完全不说明是哪个字段/什么值出错。复现（token 取 qa-e2e-tester）：① POST /v1/data-sources body {name:'e2e-enum-probe',type:'bogus',jdbc_url:'...',username:'u',password:'p'} → CM001 Failed to read request（type 枚举非法）；② 同端点 type:'H2'（/v1/system/config 只返回 MYSQL/POSTGRESQL/MARIADB/CLICKHOUSE/DORIS 五种，H2 不在其中）→ 同样 CM001 Failed to read request；③ 同端点 body 截断为 '{name: x, '（JSON 语法错误）→ 同样 CM001；④ 同端点 name 传对象 {a:1}（类型不匹配）→ 同样 CM001；⑤ POST /v1/data-sources/test-connection 传 type:'H2' → 同样 CM001。对比：登录接口 type:'bogus' 走显式校验，返回可读的 'Unsupported authentication type: bogus'(AUTH004)。根因：GlobalExceptionHandler.extractMessage() 对 HttpMessageNotReadableException（父类 ResponseEntityExceptionHandler 生成的 ProblemDetail）优先取 pd.getDetail()（Spring 6.2 固定文案 'Failed to read request'），从不读取 ex.getMostSpecificCause().getMessage()（Jackson 实际信息如 'Cannot deserialize value of type com.dati.db.DbType from String "H2": not one of the values accepted for Enum class: [...]'）。影响：所有枚举/类型/语法错误对调用方不可自诊断，前端只能提示'请求参数错误'，与仓库内已修复的同类文案问题（如 SEARCH_METADATA 空 keywords 提示 size 约束）一致程度不足。建议：extractMessage() 对 HttpMessageNotReadableException 分支改为输出 mostSpecificCause 的精简信息（枚举错误附带可选值列表，必要时脱敏/截断），并补 GlobalExceptionHandlerTest 覆盖枚举非法、JSON 语法错误、字段类型不匹配三种场景。
  - id: BUG-20261023-004
    title: 语义层写接口事务回滚后 ES 索引不回滚：失败请求残留孤儿 SUBJECT 文档，更新失败时索引与数据库不一致
    module: 语义层
    severity: medium
    fixed_at: 2026-10-24
    description: |
      TC-SEM-001/006 探索（站在检索使用方角度核对 ES 与数据库一致性）：SubjectService.createSubject/updateSubject 在 @Transactional 方法内先 save 数据库（未 flush）再同步 semanticIndexService.save(doc)，当数据库写入在提交阶段失败时事务回滚，但 ES 文档已落库且无人补偿，形成孤儿/脏索引。复现（qa-e2e-tester，dev 环境）：①POST /v1/subjects name=65 字符 → 500 CM003；随后 GET /v1/subjects/{uuid} → 404（数据库无记录），但 ES semantic_search 中 subject:{uuid} 文档存在（keywords=[该 65 字符名]）；②POST /v1/subjects name=probe-longdesc + description=1025 字符 → 500，同样 DB 404 但 ES 文档 id=subject:3c359be9-… 残留；③PUT /v1/subjects/{id} description=1025 字符 → 500 CM003，API 详情 description 仍为原值（3 字符），而 ES 文档 description 被写成 1025 字符、updatedTime 已刷新，即搜索侧展示的内容数据库并不存在。影响：语义检索/MCP 主题搜索（GET_SUBJECTS/SEARCH_METADATA 走 ES）可能返回不存在或已过期的主题及描述，用户看到搜索结果却无法打开详情；本会话已手工删除 3 条测试产生的孤儿文档（subject:3c359be9/1bf05d2c/135a0351），但产品侧无自动清理机制。建议：①按 BUG-20261023-003 在 DTO 层前置长度校验，避免此类 500；②索引写入改为事务提交后执行（@TransactionalEventListener(phase=AFTER_COMMIT)）或失败补偿（catch 后按 id 删除 ES 文档）；③补「DB 写入失败不产生 ES 文档」的集成测试。
  - id: BUG-20261023-005
    title: 前端注册页密码长度校验被原生约束拦截，i18n 提示「密码长度需为 8–72 位」永不出现
    module: 认证
    severity: low
    fixed_at: 2026-10-24
    description: |
      TC-AUTH-009 步骤 5 探索：frontend/src/pages/register.vue 的密码输入框带 :minlength=8 / :maxlength=72，浏览器 HTML5 约束校验会在表单 submit 前拦截提交。实测（vite dev + Playwright）：填 7 位密码点击「注册」→ 只出现浏览器原生气泡「请将该文本增加为 8 个字符或更多（您当前使用的是 7 个字符）」，未发出任何请求（POST /v1/auth/register 未触发，网络面板为空），但 handleRegister 里基于 t('auth.passwordLengthInvalid') 的 ElMessage 分支根本不会执行；>72 位同理 —— 因 maxlength 截断，输入框最多只能到 72 位（实测填 73 字符后 value 长度为 72），超上限分支同样不可达。影响：用例要求的「出现密码长度需为 8–72 位提示」无法复现，且原生气泡不含上限说明、与页面其余文案风格不一致；密码不一致分支可正常弹出 ElMessage（已实测「两次输入的密码不一致」），说明提示链路本身正常。建议：去掉 el-input 的 minlength/maxlength 原生属性（保留 JS 校验），或接受原生校验并同步修订用例与该分支的死代码。
  - id: BUG-20261023-006
    title: test-data.yaml 中 qa_admin（admin/admin123）凭据失效，admin 账户无法登录
    module: 认证/test-data
    severity: low
    fixed_at: 2026-10-24
    description: |
      TC-AUTH-001 前置登录探索：POST /v1/auth/login {"name":"admin","password":"admin123","type":"local"} → 401 AUTH001 invalid credentials，而 username=admin 已被占用（POST /v1/auth/register name=admin → 409 AUTH003），说明账户存在但密码与文档不符。application.yaml auth.admin-users 默认 admin，permission / mcp-service 等模块用例依赖此全局管理员账户，凭据不可用会导致管理员路径无法验证。2026-10-22 报告已记为 WARN-7，2026-10-23 复测仍失效。建议：修正 test-data.yaml 与预置密码（或提供管理员预置脚本）。
  - id: BUG-20261023-007
    title: MCP tools/call 区分「数据源不存在」与「数据源不在服务范围」，未授权用户可探测数据源存在性
    module: MCP Endpoint
    severity: low
    fixed_at: 2026-10-24
    description: |
      TC-END-003 探索（站在 MCP Client / 多租户视角核对错误语义，用例只要求 isError=true）：tools/call execute_sql 传一个不属于该服务 scope 的 data_source_id 时，返回的错误取决于该数据源是否存在于平台：
      ① data_source_id=00000000-0000-0000-0000-000000000000（不存在） → 200 {isError:true, content[0].text:'数据源不存在'}（ToolError.DATA_SOURCE_NOT_FOUND，PARAM_ERROR）；
      ② data_source_id=9d05fd88-3fde-458f-82e6-94a37e3260ac（存在，但未绑定到 e2e-end-main 服务） → 200 {isError:true, content[0].text:'数据源或表不在服务范围内：Data source 9d05fd88-… not in service scope'}（ToolError.SCOPE_VIOLATION）。
      两条文案可区分，等于给出「该 UUID 是平台内真实数据源」的存在性预言机（同一现象也影响自定义 PARAMETERIZED_SQL 工具，ParameterizedSqlExecutor 同结构）。根因：ExecuteSqlExecutor.execute()/ParameterizedSqlExecutor.execute() 先 dataSourceService.getDataSourceInternal(dsId) 再 scopeValidator.validate(...)，即先做全局存在性查询、后做 scope 校验；正确顺序应先 validateScopeCoverage 再加载数据源，或对外统一返回 SCOPE_VIOLATION 文案。附带：①'数据源不存在' 为纯中文且无 dsId/英文尾缀，与相邻 'not in service scope' 中英混排并存，与「面向 LLM 的协议消息应确定性可解析」的约定不一致；②该分支下 error_category 为 PARAM_ERROR，与 scope 违规的 SCOPE_ERROR 不同，LLM 可能据此判断为参数拼写错误而反复重试同一 uuid。建议：scope 校验前移，并让两条分支对外文案与 error_category 一致（或统一为 Data source not found or not in service scope）。
  - id: BUG-20261023-010
    title: JWT 校验不校验必需声明：缺 exp 的合法签名 token 永久有效，缺 sub 时 /me 返回 id:null
    module: 认证
    severity: low
    fixed_at: 2026-10-24
    description: |
      TC-AUTH-010 探索（站在凭证校验方角度验证 JwtTokenHelper.validateToken 的声明校验强度，用 .env 中的真实 JWT_SECRET 自签 token）：①签名正确但缺少 exp 声明 → GET /v1/auth/me 返回 200 {"id":"0000…0001","name":"admin","display_name":"admin"}，即该 token 永不过期（对比：exp 已过期的 token 正确返回 401 AUTH002）；②iat 在未来（now+86400）且 exp 也未到 → 200，未拒绝；③缺少 sub 声明 → 200，响应体 id:null（{"id":null,"name":"ghost","display_name":null,"is_guest":false}）；④缺少 name → 200 name:null；⑤exp 设为 10 年后 → 200。根因：JwtTokenHelper.validateToken 只用 Jwts.parser().verifyWith(key).parseSignedClaims()，JJWT 仅对「存在的」exp 做校验，不会要求声明齐全，也不校验 iat；同时 /v1/auth/me 直接回显 claim 不查库。影响：服务自身签发的 token 恒带 exp(7d)，但一旦密钥泄露或内部误签，攻击者可持永不过期 / 不含 sub 的 token 长期驻留；缺 sub 的 token 会让下游取 user.getId() 得到 null（当前 /me 返回 id:null 而非 400/401），属于越权判定的隐患输入。建议：validateToken 显式校验 claims.getExpiration()!=null 且 sub/name 非空（否则抛 JwtException → AUTH002），并补 JwtTokenHelperTest 覆盖「缺 exp / 缺 sub / iat 未来」三类用例。注：2026-10-23 上一轮报告曾记「无 exp 声明 → 401」，本轮用真实密钥复测为 200，上轮结论应属签名不匹配导致的误判。
  - id: BUG-20261023-011
    title: 列同步接口 POST /columns/sync 不校验 tableId 归属路径 datasourceId，可用数据源 A 的路径同步（覆写）数据源 B 的表列
    module: 数据源管理-列管理
    severity: medium
    fixed_at: 2026-10-24
    description: |
      TC-DS-010/011 延伸探针（BUG-20261022-009 同类面遗漏）发现：ColumnController.syncColumns(datasourceId, tableId) 只用 PathVariable datasourceId 做 permissionService.requireDataSource(EDIT)，随后 ColumnService.syncColumns 直接 tableInfoDAO.findById(tableId) 取表，从不校验该表的 dataSourceId 是否等于路径 datasourceId，再用**路径数据源**的连接（jdbcMetaService.getColumns(datasourceId, tableInfo.schema, tableInfo.name)）读元数据并写入目标表的列与 ES FIELD 文档。复现（qa-e2e-tester）：①创建数据源 A(e2e-probe-dsA) 添加 genre 表并同步列，创建空数据源 B(e2e-probe-dsB)；②POST /v1/data-sources/{B}/tables/{A 的 genre tableId}/columns/sync → 200 {id: <tableId>}（期望 404，表不属于 B）；③同一 tableId 换 true 的 /values/extract 则被正确拦截（400 CM001 Column does not belong to data source），说明校验在同模块内并不一致。影响：仅对 A 有 EDIT 权限的用户可对 B 的表触发列同步：用 A 的连接/库结构覆写 B 的列元数据（列名、类型），并删除 B 中在 A 里不存在的列（级联删除 FIELD/FIELD_VALUE 索引文档），属跨数据源的元数据污染；同时表级 PUT/DELETE 已在 BUG-20261022-009 修复，本端点漏改。建议：syncColumns 增加 requireTableInDatasource(datasourceId, tableId) 校验（复用 TableService 已有方法），并补「表不属于路径数据源 → 404」单测。
  - id: BUG-20261023-012
    title: 列更新 PUT /columns/{id} 忽略路径 datasourceId/tableId，归属不一致仍返回 200；同类越权场景在 values/extract 返回 400 CM001 而非 404（契约不一致）
    module: 数据源管理-列管理
    severity: low
    fixed_at: 2026-10-24
    description: |
      TC-DS-011 延伸探针：①PUT /v1/data-sources/{B}/tables/{A.tableId}/columns/{A.columnId} {"description":"cross-ds-probe","aliases":["cross"]} → 200 {id:<columnId>}，且随后 GET /v1/data-sources/{A}/tables/{A.tableId}/columns 可见 description/aliases 被真实修改（ColumnController.updateColumn 签名只取 id，完全忽略 datasourceId/tableId，ColumnService.updateColumn 从列的 tableId 反查真正归属并校验 EDIT 权限）。权限上不会越权（校验的是真实归属），但路径语义被静默忽略，调用方传错路径也拿到 200，无法察觉；且与 BUG-20261023-011 的 sync 端点行为不一致。②POST /v1/data-sources/{B}/tables/{A.tableId}/columns/{A.columnId}/values/extract → 400 CM001 'Request parameter error: Column does not belong to data source: <id>'，虽然正确拦截，但用通用参数错误码 CM001/400 表达「资源不存在/不属于该路径」，与 BUG-20260821-001 已修复的「表不存在误用 DS002」同类，语义仍误导（应为 404 DS007 类）。建议：列级子资源接口统一先校验 (datasourceId, tableId, columnId) 归属链，不一致返回 404 专用错误码，并补对应单测。
  - id: BUG-20261023-013
    title: ACL 授权接口无 self-grant 保护：用户可把自己降级、owner 自我授权写入冗余 ACL 行
    module: 权限-资源授权
    severity: low
    fixed_at: 2026-10-24
    description: |
      TC-PM-003/005 探索发现（2026-10-23 与 2026-10-19/22 报告 WARN 同源，本轮首次落库）：POST /v1/acls/{type}/{resourceId} 对『主体 = 调用者自己』与『主体 = 资源 owner』无任何特殊处理，AclService.grant 只做 requireCurrentUser(EDIT) 后直接 upsert。
      复现（qa-user-a/qa-user-b，ds 为 A 创建）：
      ① A grant B EDIT → 200；B 再以 principal_id=B、permission=VIEW 调用同一接口 → 200，ACL 行被覆盖为 VIEW（记录 id 不变），此后 B 的 PUT /v1/data-sources/{id} 变为 403 PM001 —— 调用方在没有任何提示的情况下把自己降权，且响应体只有 ACL id，无法察觉『我把自己的权限改小了』；
      ② A（owner）以 principal_id=A、permission=EDIT 授权自己 → 200 {"id":"<新行>"}，ACL 列表从 1 行变 2 行，出现一条指向 owner 的冗余行（owner 本就通过 PermissionService.can 的 ownerId 分支拥有全权，该行无任何作用，却在列表里显示为普通被授权者，易误导使用者以为权限来自 ACL）。
      期望：self-grant 应被拒绝（400/403）或视为 no-op（不降级、不写行）；owner 自我授权应被拒绝或静默忽略，列表不出现冗余行。
      根因：AclService.grant 未比较 RequestContext.getUser().getId() 与 principalId/ownerId。
      建议：grant 前对 principalType=USER 时：principalId == 当前用户 → 拒绝或 no-op；principalId == resolveOwnerId(type, resourceId) → 拒绝或 no-op；并补 AclServiceTest 覆盖『自我降级』『owner 自授』两类场景。
  - id: BUG-20261023-014
    title: GET /tables/added-names 只返回裸表名不含 schema：多 Schema 数据源同名表混淆，添加表对话框会误禁用未导入的表
    module: 数据源管理-表管理
    severity: low
    fixed_at: 2026-10-24
    description: |
      复现（qa-e2e-tester，2026-10-23，TC-END-015 步骤 10 延伸探针）：postgres 建 e2e_dup_a.dup_tbl 与 e2e_dup_b.dup_tbl 两个同名表 → 新建数据源后仅导入 e2e_dup_a.dup_tbl → GET /v1/data-sources/{ds}/tables/added-names 返回 ["dup_tbl"]（无 schema 前缀，与 /tables 列表里 schema+name 双字段的信息量不一致）。
      根因：TableService.getAddedTableNames 仅 map(BaseResourcePO::getName) 返回 name，丢弃 schema；而 frontend/src/pages/datasources/[id]/tables/index.vue:60 用 addedTableNames.includes(table.name) 判断『已添加』，把包含 Schema 上下文的候选表与不含 schema 的已添加名直接比对。
      影响：SCHEMA_SCOPE 数据源或多 schema 数据源中，用户在 e2e_dup_b 的建表对话框里看到 dup_tbl 被灰色禁用（实际只导入了 e2e_dup_a.dup_tbl），无法完成导入；反向亦成立。TC-END-015 的 CREATE TABLE 自动纳管会让这种情况变常见（服务在任意 allowed_schemas 里建表，与已有同名列自然撞名）。
      建议：getAddedTableNames 返回 schema 限定名（如 s1.t2 或同时返回 {schema,name} 结构），前端按复合键比对；或新增 GET /tables/added?schema= 过滤。补 TableServiceTest 覆盖两个同名表的返回。
  - id: BUG-20261024-001
    title: UPSERT_TERM 通过 MCP 创建的术语缺少创建人（created_by/created_user_name 为 null），与平台 API 创建行为不一致
    module: MCP 服务
    severity: low
    fixed_at: 2026-10-24
    description: |
      TC-MCP-023 探索（站在平台管理员视角核对审计信息一致性）：通过 MCP 工具 UPSERT_TERM 创建术语后，平台 API GET /v1/subjects/{subjectId}/terms 返回的对象 created_by/created_user_name/updated_by/updated_user_name 均为 null（created_at 有值），而同一主题下由平台 API 创建的术语（如种子术语「音乐流派」）created_by=8cba4bbd-…、created_user_name=qa-e2e-tester 正常填充。复现（qa-e2e-tester）：①创建 SUBJECT scope 服务并启用 UPDATE_COLUMN_INFO/UPDATE_TABLE_INFO 同类写工具；②PUT /tools/UPSERT_TERM {"tool_type":"UPSERT_TERM","enabled":true} → 200；③POST /tools/UPSERT_TERM/test，terms=[{subject_name:e2e-chinook-subject,name:E2E元数据写入术语,description:…,aliases:[…]}] → 200、change_type=CREATE；④GET /v1/subjects/7409fee3-…/terms?keyword=E2E元数据写入术语 → data[0].created_by=null、created_user_name=null；同次调用修改描述走 UPDATE 时 updated_by 仍为 null。根因：TermService.createTerm/updateTerm 只做权限校验与 ES 索引，不写审计字段，平台侧 TermController 在调用前用 BaseAssembler.fillUsersFromRequest 填充；MCP 的 UpsertTermExecutor 直接调用 TermService，绕过了 assembler 填充。影响：术语列表/详情「创建人」列在 AI 写入的术语上为空，平台管理员无法追溯是谁（哪个 MCP 客户端调用者）写入的；MCP 侧虽有 McpMetadataAuditLog，但平台 UI 不可见，审计链路断裂。建议：在 TermService.createTerm 内统一从 RequestContext.getUser() 填充 createdBy/updatedBy（MCP 工具调用链同样带登录用户上下文，invocation-logs 的 caller_name 已证明可见），或在 UpsertTermExecutor 构造 Term 时显式填充；UPDATE_TABLE_INFO/UPDATE_COLUMN_INFO 的 updated_by 同理应自查，并补「MCP 写入后审计字段非空」的单测。
  - id: BUG-20261024-002
    title: 删除数据源表后术语关联未清理，术语详情返回 table_name=null 的悬空关联
    module: 语义层-术语管理
