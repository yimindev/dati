  - id: BUG-20261019-011
    title: 列表 keyword 中的 SQL LIKE 通配符（% 与 _）未转义，搜索命中全部记录
    module: 语义层-列表查询
    severity: low
    fixed_at: 2026-10-21
    description: |
      TC-SEM-008 探索：GET /v1/subjects?keyword=%25（即 '%'）与 keyword=_ 均返回 total=4（全部主题），keyword 被直接拼进 LIKE 模式而未转义 %/_，用户搜索含下划线或百分号的名称时会得到全量结果。建议转义为 \% / \_ 或使用 ESCAPE 子句。
