  - id: BUG-20260820-001
    title: UPDATE_COLUMN_INFO/列同步 静默重置 extract_value_enabled 并级联删除 FIELD_VALUE 文档
    module: MCP 服务管理 / 数据源管理
    severity: high
    fixed_at: 2026-08-20
    description: |
      两条路径均会静默丢失用户配置与值数据（e2e TC-DS-011 步骤 19 回归锚点）：
      ① MCP UPDATE_COLUMN_INFO：executor 构造部分更新 ColumnInfo 时 extractValueEnabled/aliases 默认非 null，
        updateColumn 的 null 判断恒真 → 无条件置 false → 触发 FIELD_VALUE 级联删除。
        修复：ColumnInfo/ColumnInfoVO 移除默认值（null 表示未指定），Mapper/Assembler 补 null 防御；
        ColumnService 重建 ES 文档改用合并后的 PO 描述。
      ② 管理端列同步 syncColumns：重建 PO 不拷贝 existing.getExtractValueEnabled()，且整表删除 ES 文档。
        修复：existing 分支保留 extractValueEnabled；ES 清理改按类型（deleteByTableIdAndType FIELD）+
        仅对消失列按列删除 FIELD_VALUE，仍存在列的值文档（含 synonyms）保留。

