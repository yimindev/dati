bugs:
  - id: BUG-012
    title: TABLE scope type 未实现，保存时返回 500 且无友好错误
    module: MCP 服务管理
    severity: low
    fixed_at: 2026-07-26
    description: |
      DataScopeItemVO.scopeType 从 String 改为 McpDataScopeType 枚举。
      Jackson 反序列化阶段校验非法值，自动返回 400 + 枚举取值范围提示。

  - id: BUG-010
    title: MCP 服务列表 status 筛选与 keyword 联用时失效
    module: MCP 服务管理
    severity: medium
    fixed_at: 2026-07-26
    description: |
      findAllByNameContainingOrIdAndStatus 解析为 (name LIKE ?) OR (id = ? AND status = ?)，
      status 条件只在 id 分支生效。改为 @Query 显式定义 JPQL：
      (name LIKE :keyword AND status = :status) OR (id = :keyword AND status = :status)。

