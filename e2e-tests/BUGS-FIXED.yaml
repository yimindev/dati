      修复：SubjectService.removeTableFromSubject 在删除 subject_table 前，按 subject 取出术语 ID 并调用新增的 TermRelationDAO.deleteByTermIdInAndTableId 级联删除指向该表的关联，其余表的关联保留。SubjectServiceTest 覆盖有/无术语场景，TermRepositoryTest 覆盖只删目标表关系；真实后端 curl 验证移除 genre 后 FIELD(genre.name) 关系消失、artist 关系保留。
  - id: BUG-20261022-012
