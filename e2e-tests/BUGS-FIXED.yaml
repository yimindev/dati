  - id: BUG-20260809-001
    title: term_relation 表存在遗留唯一约束 UK_TERM_RELATION(term_id,table_id,field_name)，FIELD 与 FIELD_VALUE 关系无法共存（第二个 500）
    module: 语义层
    severity: high
    fixed_at: 2026-08-09
    description: |
      dev 环境 H2 库 term_relation 表存在旧版遗留的 UNIQUE(term_id,table_id,field_name) 约束（当前代码 TermRelationPO 未声明，git 历史亦无），导致同一术语/表/列上先后添加 FIELD 与 FIELD_VALUE 关系时，第二个请求 500 CM003。已验证与顺序无关（FIELD→FIELD_VALUE 或 FIELD_VALUE→FIELD 均复现）。TC-SEM-004 要求两者共存（FIELD+FIELD_VALUE 双关系），TC-MCP-020 种子术语关联展开亦受影响（FIELD_VALUE 文档命中后按 tableId 归并，受限于唯一约束无法建双关系）。根因：Hibernate ddl-auto:update 不会删除遗留约束，需手动迁移（如启动时 ALTER TABLE DROP CONSTRAINT 或引入 Flyway）。
        - id: BUG-20260809-004
  - id: BUG-20260809-004
    title: mcp_prompt.description 存量库仍 NOT NULL：BUG-011 修复对旧 H2 库无效（ddl-auto:update 不 ALTER 已存在列），创建不带 description 的 Prompt 仍 500
    module: MCP 服务管理
    severity: medium
    fixed_at: 2026-08-09
    description: |
      代码 McpPromptPO.description 已无 nullable=false（BUG-011 2026-07-26 修复），但 H2 文件库 INFORMATION_SCHEMA 显示 DESCRIPTION IS_NULLABLE=NO。根因同 BUG-20260809-001：项目无 Flyway 等迁移机制，PO 列定义变更无法同步到存量库。E2E 复现：POST /prompts 不带 description → 500 DataIntegrityViolation NULL not allowed。建议：引入启动时 schema 自检/迁移，或删除存量 H2 库重建（仅 dev 环境可行，需确认无手工数据）。
