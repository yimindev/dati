  - id: BUG-20260824-004
    title: 模板参数加引号时运行时报错且无校验提示
    module: MCP 服务管理
    severity: low
    fixed_at: 2026-08-25
    description: |
      TC-MCP-024 首次执行发现：PARAMETERIZED_SQL 模板中给参数/系统变量加单引号（如 WHERE name = '{{genre_name}}'、'{{_user.name}}'）时，创建/校验阶段不报错，模板预览渲染为 ''值''（不报错），但实际执行 SQL_ERROR：The column index is out of range: 1, number of columns: 0。根因：{{var}} 绑定为 ? 占位符，'?' 在单引号内不被 pgjdbc 计为占位符，bind 数(1) > 占位符数(0)。docs/user-guide/template-syntax.md 明确字符串自动加引号、不应手动加引号（TC-TPL-004 同 commit 用例即未加引号），故按文档写法功能正常（已验证系统变量注入与防篡改均工作）。但产品对错误用法零校验、错误信息晦涩，建议创建时校验或在 SQL_ERROR 时给出可读提示。
