# E2E 测试环境配置
# Agent 启动测试时的精确参数参考

server:
  base_url: "http://localhost:8085"
  working_directory: "/Users/zhangyimin/IdeaProjects/dati"
  # 从仓库根 pom 启动 install：根 pom 是 dati-parent + backend 聚合，能同时安装父 POM 与全部模块。
  # 注意：只用 -f backend/pom.xml 不会安装根 POM（dati-parent），版本号变更后 spring-boot:run 会因
  # "Could not find artifact com.dati:dati-parent:pom:x.y.z" 启动失败。
  # E2E 管理员账号：test-data.yaml users.qa_admin 必须在 ADMIN_USERS 中，首次运行注册后即拥有管理员权限。
  start_command: "export ADMIN_USERS=admin,qa-e2e-admin; mvn -f pom.xml -q -DskipTests install && mvn -f backend/app/pom.xml spring-boot:run -Dspring-boot.run.workingDirectory=/Users/zhangyimin/IdeaProjects/dati"
  ready_signal: "Started DatIApplication"

runner:
  model: "deepseek-flash"

auth:
  register_endpoint: POST /v1/auth/register
  login_endpoint: POST /v1/auth/login
  token_header: "Authorization: Bearer"

conventions:
  username_pattern: "qa-{timestamp}-{random}"
  body_format: snake_case
  idempotency:
    register_duplicate: warn  # 注册到已存在的用户时，记 warn，不报失败

external_services:
  elasticsearch:
    uris: "http://localhost:9200"
    username: "elastic"
    password: "yimin123"
    index: "semantic_search"
    doc_types:
      TABLE: "表元数据，id 格式 table:{tableId}"
      FIELD: "列元数据，id 格式 field:{columnId}"
      FIELD_VALUE: "维度值，id 为维度值自身的 UUID"
      TERM: "术语，id 格式 term:{termId}"
    query_conventions:
      by_datasource: "entity.datasourceId = {datasourceId}"
      by_table: "entity.tableId = {tableId}"
      by_column: "entity.field = {columnName} AND entity.tableId = {tableId}"
      cleanup_check: "删除数据源/表/列后，按 datasourceId 查询应返回 0 条对应 type 的文档"
  postgresql:
    url: "jdbc:postgresql://localhost:5432/postgres"
    username: "postgres"
    password: "yimin123"

# MCP endpoint 验收（scripts/mcp-verify.sh 默认配置）
mcp:
  code: "mcp-verify-demo"        # 已发布的验收服务代码
  tool_name: "list_genres"       # Inspector tools/call 演示工具
  prompt: "analyze_genre"        # Inspector prompts/get 演示 prompt
  proxy_port: 18085              # Conformance 代理端口（JWT 注入）
