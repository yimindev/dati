  - id: BUG-20261019-012
    title: 删除数据源/主题/MCP 服务后 ACL 授权记录未级联清理，RESOURCE_ACL 残留孤儿行
    module: 权限-资源授权
    severity: low
    found_at: 2026-10-19
    description: |
      TC-PM-002~016 主线/自包含用例清理阶段发现：删除资源（DELETE /v1/data-sources/{id}、/v1/subjects/{id}、/v1/mcp-services/{id}）均返回 200 且资源本体与表/列元数据已级联删除，但 RESOURCE_ACL 中对应授权行全部保留。实测本轮 12 条 ACL 记录在资源删除后仍存在（如 ds-2 85111706…、svc-1 29b9215d…、subject-1 9ed4fc09…、ds-admin fca98f18… 等，直接查 H2 确认资源表 0 行、RESOURCE_ACL 仍 12 行），且 GET /v1/acls/{type}/{resourceId} 此时只会返回 404（资源不存在），前端无法清理这些脏数据。根因：ResourceAclDAO.deleteByResourceTypeAndResourceId 已定义但从未被调用，DataSourceService/SubjectService/McpServiceService 的删除路径未接权限侧清理。影响：授权表随测试/日常删除无限增长；若未来出现资源 ID 复用（导入、回滚、ID 手工指定）会直接复活旧授权。建议：三个资源删除处统一调用 aclDAO.deleteByResourceTypeAndResourceId（或抽象 PermissionService.onResourceDeleted），并补单测。
