bugs:
  - id: BUG-20261019-001
    title: 模板预览显示 SQL 按 replaceFirst 逐个替换 '?'，模板文本含字面问号时替换错位
    module: MCP 服务管理
    severity: medium
    found_at: 2026-10-19
    description: |
      复现（POST /v1/template/preview, mode=SQL）：
      1) template="SELECT * FROM track WHERE name LIKE '%?%' AND genreid = {{g}}", values={g:1}
         → rendered="SELECT * FROM track WHERE name LIKE '%1%' AND genreid = ?"（'?' 未被替换，字面 %?% 反被写成 %1%）
      2) template="SELECT * FROM t WHERE data ? 'key' AND name = {{n}} AND id = {{i}}", values={n:'x', i:7}
         → rendered="SELECT * FROM t WHERE data 'x' 'key' AND name = 7 AND id = ?"（PostgreSQL JSONB ? 运算符被吃掉，绑定值整体错位）
      期望：rendered 应为 "... LIKE '%?%' AND genreid = 1" / "... data ? 'key' AND name = 'x' AND id = 7"。
      根因：TemplatePreviewController.toDisplaySql 用 sql.replaceFirst("\\?") 循环替换，按字符串首次出现位置匹配，而 PreparedSql 的占位符只对应 VarNode 产生的 '?'；模板文本里的字面 '?'（PostgreSQL JSONB ? 运算符、LIKE '%?%'、普通文本问号）会被优先命中。
      影响：预览给用户一段错误的 SQL（显示用，不会被执行），用户对照/复制时会得到与真实执行结果不一致的语句。
      建议：改为按编译期 AST/绑定位置生成展示 SQL（SqlRenderer 一并返回变量在 SQL 中的位置），或渲染时用不可碰撞的临时占位符（如 \u0000）再按顺序替换，并对模板文本中的 '?' 做区分。需补单测覆盖上述两种模板。
  - id: BUG-20261019-002
    title: 模板预览字符串值未转义单引号，rendered 生成非法 SQL
    module: MCP 服务管理
    severity: low
    found_at: 2026-10-19
    description: |
      复现：POST /v1/template/preview {"mode":"SQL","template":"SELECT * FROM artist WHERE name = {{name}}","values":{"name":"O'Brien"}}
      → rendered="SELECT * FROM artist WHERE name = 'O'Brien'"（单引号未转义，SQL 语法错误）。
      期望：rendered 中字符串值应转义为 'O''Brien'（或 \'），保证展示 SQL 可被直接复制执行。
      根因：TemplatePreviewController.formatValue 仅做 "'"+s+"'" 拼接，未对 s 内的单引号做转义。
      影响：仅影响预览展示（该 SQL 不执行），但用户复制到 SQL 客户端会报语法错误，同时误导判断输入是否合法。
      建议：formatValue 对 String 内的单引号做 SQL 标准转义（s.replace("'", "''")），并补单测。
  - id: BUG-20261019-003
    title: 游客可创建 API Key，但生成的 key 永远无法通过认证（401）
    module: 认证
    severity: low
    found_at: 2026-10-19
    description: |
      TC-AUTH（探索发现）：携带 guest token 调用 POST /v1/auth/api-keys 返回 201 并下发 sk_ 明文 key（expires_at=null），但用该 key 请求 GET /v1/auth/me、GET /v1/data-sources 均返回 401。根因：ApiKeyService.create 仅写入 userId，不校验该用户在 users 表中是否存在；guest 身份是纯 JWT（GuestService 不落库），ApiKeyAuthenticationProvider.authenticate 中 userRepository.findById(key.userId) 为空即认证失败。影响：①游客拿到的是永不过期的死凭证，前端若引导游客创建 key 会出现“创建成功但不可用”；②未登录者可无限创建 key 行，造成脏数据。建议：创建 API Key 时对游客身份直接拒绝（403，错误码 AUTH/GUEST 前缀）或校验 userId 存在。
  - id: BUG-20261019-004
    title: ES 索引中 TABLE/FIELD 文档的 createdTime 在元数据更新时被重置为更新时刻
    module: 数据源管理
    severity: low
    found_at: 2026-10-19
    description: |
      TC-DS-010 步骤 13 / TC-DS-011 步骤 11 复现：更新表别名与描述后，ES 文档 table:{tableId} 的 createdTime 由 2026-10-19T22:53:23.092 变为 2026-10-19T22:53:33.471（等于 updatedTime）；列更新同样现象。根因：TableService.updateTable/ColumnService 重建 SemanticSearchDocument 时未回填原有 createdTime，SemanticIndexService.save 只在 createdTime 为 null 时才赋值为 now，故每次更新都会把创建时间覆盖为更新时刻。影响：语义检索侧无法区分创建与更新时间，审计信息失真。修复方向：更新时先按 id 取出既有文档并沿用其 createdTime。
  - id: BUG-20261019-005
    title: 重复添加 TABLE 级术语关联返回 200 并产生重复关系（FIELD 级有唯一约束，TABLE 级无）
    module: 语义层-术语管理
    severity: medium
    found_at: 2026-10-19
    description: |
      TC-SEM-007：同一术语对同一表重复 POST /v1/terms/{id}/relations（entity_type=TABLE，不传 field_name）两次均返回 200，术语详情出现 2 条完全相同的 TABLE 关系；而 FIELD 级重复会返回 400 'Term relation already exists'。原因：唯一约束 UK_TERM_RELATION(term_id, table_id, field_name) 对 NULL field_name 不生效（NULL != NULL），服务层也未做 TABLE 级存在性校验。用例约束要求『同一术语下同表只能一条 TABLE 关系』，需在服务层按 field_name IS NULL 做存在性判断。
