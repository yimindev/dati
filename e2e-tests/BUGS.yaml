  - id: BUG-20261019-015
    title: PARAMETERIZED_SQL 工具的 required/default_value 仅在 inputSchema 声明，tools/call 运行时既不校验也不填充，缺参静默绑定 NULL
    module: MCP Endpoint
    severity: medium
    found_at: 2026-10-19
    description: |
      探索发现（TC-END-003/TC-END-011 附带）：
      复现：MCP 服务（code=e2e-end-main，v7）自定义工具 list_genres（PARAMETERIZED_SQL，parameters=[{name:genre_name,type:STRING,required:true}]），tools/list 的 inputSchema 正确输出 required=["genre_name"]；
      ① tools/call params={name:list_genres, arguments:{}} → HTTP 200、result.isError=false、structuredContent.executed_sql="SELECT * FROM genre WHERE name = ?"、bindings=[null]、rows=[]（无任何错误提示）
      ② 传错参数名 arguments={genre:"Rock"} 同样 isError=false + bindings=[null]
      ③ default_value 同样不生效：工具 probe_default 的 parameters=[{name:genre_name,required:false,default_value:"Rock"}]，schema 输出 properties.genre_name.default="Rock"，但 arguments={} 时 bindings=[null]、rows=[]（默认值未填充）
      期望：缺必填参数应返回 isError=true（与预置工具一致，PARAM_INVALID/PARAM_MISSING，供 LLM 自纠错），或至少按 default_value 填充后再渲染。
      根因：ParameterizedSqlExecutor.execute 仅把 ctx.argumentsMap() 合并系统变量后交给 SqlRenderer，未遍历 config.getParameters() 校验 isRequired()，也未把 ToolParameter.defaultValue 回填进渲染上下文（ToolParameter.getDefaultValue 全项目仅被 ToolDefinitionConverter 用于生成 JSON Schema 的 default 字段）。
      影响：inputSchema 声明的契约与实际执行不一致；LLM 用缺失/拼错参数名调用时拿到「空结果集 + 无错误」，会误判业务数据为空而无法自纠错；参数默认值形同虚设。
      建议：ParameterizedSqlExecutor 渲染前按 config.parameters 做 required 校验（缺失 → ToolExecuteException PARAM_MISSING → isError=true），并缺失时用 defaultValue 回填；补充单测覆盖缺参/默认值/参数名拼错三种场景。
