      探索种子数据时发现：同一术语「音乐流派」（b9d6763e）在主题术语列表接口返回 relations: []，而术语详情接口返回完整关联 [{entity_type: FIELD, table: genre, field: name}]。影响：依赖列表接口判断术语关联会误判数据缺失（本次差点因此误报种子数据不完整）；若前端列表展示关联也会显示为空。关联数据本身完整（TermRelation 表有记录，搜术语名实测可展开关联表）。
