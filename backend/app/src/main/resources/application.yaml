system:
  column-value-sample-limit: 1000
  column-value-length-limit: 256

server:
  port: 8085

spring:
  application:
    name: DatI
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  data:
    web:
      pageable:
        one-indexed-parameters: true
  jackson:
    property-naming-strategy: SNAKE_CASE

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

auth:
  admin-users: ${ADMIN_USERS:admin}
  jwt:
    secret: ${JWT_SECRET:this-is-a-32-char-long-default-secret-key}
    expiration-seconds: 604800

dati:
  elasticsearch:
    # 语义检索索引的分词器类型（仅在索引首次创建时生效）
    # standard 为 ES 内置分词器，无需任何插件；ik_max_word 需要 IK 插件（中文词级分词）
    index-analyzer: ${DATI_ELASTICSEARCH_INDEX_ANALYZER:standard}
    # 查询时的分词器类型；留空则回退为 index-analyzer；ik_smart 需要 IK 插件
    search-analyzer: ${DATI_ELASTICSEARCH_SEARCH_ANALYZER:}
  mcp:
    # MCP endpoint 基础 URL（完整 URL 前缀，如 https://mcp.example.com），空则返回相对路径 /{code}/mcp
    endpoint-base-url: ${MCP_ENDPOINT_BASE_URL:}
    # Origin 白名单（逗号分隔完整 origin，如 https://dati.example.com），默认空：
    # 仅信任本地回环 Origin（localhost/127.0.0.1/::1），其余一律 403（DNS rebinding 防护）。
    # 远程部署且存在浏览器客户端时，在此配置信任来源。
    allowed-origins: ${MCP_ALLOWED_ORIGINS:}
    stats:
      enabled: ${MCP_STATS_ENABLED:true}
      flush-interval-seconds: ${MCP_STATS_FLUSH_INTERVAL_SECONDS:10}
      batch-size: ${MCP_STATS_BATCH_SIZE:100}
      retention-days: ${MCP_STATS_RETENTION_DAYS:15}
