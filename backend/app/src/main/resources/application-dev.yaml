spring:
  datasource:
#    url: jdbc:h2:mem:dati;DATABASE_TO_UPPER=false;QUERY_TIMEOUT=30
    url: jdbc:h2:file:${user.dir}/db/dati;QUERY_TIMEOUT=30;mode=mysql
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      path: /h2-console/dati
      enabled: true
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${SPRING_ELASTICSEARCH_USERNAME:elastic}
    password: ${SPRING_ELASTICSEARCH_PASSWORD:}
    connection-timeout: 5s
    socket-timeout: 30s

dati:
  mcp:
    endpoint-base-url: http://localhost:${server.port}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
