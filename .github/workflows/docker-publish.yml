name: Build and Push Docker Image to Aliyun ACR

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Docker Buildx（支持高级缓存和构建优化）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录阿里云容器镜像服务 (ACR)
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 4. 解析 Git Tag 元数据生成镜像标签 (例如推送到 v1.0.0 会生成 1.0.0, v1.0.0, latest)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ vars.ACR_REPOSITORY || github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}

      # 5. 构建并推送到阿里云 ACR（启用 GitHub Actions 缓存加速构建）
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 6. 自动化部署到阿里云 ECS
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Aliyun ECS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER || 'root' }}
          key: ${{ secrets.ECS_SSH_KEY }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ vars.ECS_PORT || 22 }}
          script: |
            set -e
            VERSION="${{ needs.build-and-push.outputs.version }}"
            REGISTRY="${{ vars.ACR_VPC_REGISTRY || 'crpi-baupqnroh79r2fj9-vpc.cn-hangzhou.personal.cr.aliyuncs.com' }}"
            IMAGE="${REGISTRY}/${{ vars.ACR_NAMESPACE }}/${{ vars.ACR_REPOSITORY || 'dati' }}:${VERSION}"

            echo "🚀 正在部署 DatI 新版本: ${VERSION}..."
            echo "📥 从 VPC 内网拉取镜像: ${IMAGE}..."
            docker pull "${IMAGE}"

            echo "🛑 停止并清理旧容器..."
            docker stop dati-app 2>/dev/null || true
            docker rm dati-app 2>/dev/null || true

            echo "▶️ 启动新容器..."
            docker run -d --name dati-app \
              --network dati-net \
              --restart unless-stopped \
              --memory 1536m \
              -p 18085:8085 \
              --env-file /opt/dati/app.env \
              --env-file /opt/dati/secrets.env \
              "${IMAGE}"

            echo "🧹 清理无用的历史镜像..."
            docker image prune -f

            echo "✅ 部署完成！容器运行状态："
            docker ps --filter "name=dati-app"

